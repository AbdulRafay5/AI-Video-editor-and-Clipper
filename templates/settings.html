<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    if (sessionStorage.getItem("persona-wipe") === "1") {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) sessionStorage.removeItem("persona-wipe");
      else document.documentElement.classList.add("persona-arriving");
    }
  </script>
  <title>Settings - Clipper</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .check-row { display:flex; gap:12px; align-items:flex-start; padding:8px 0; border-bottom:2px solid var(--fg); }
    .check-row:last-child { border-bottom:0; }
    .banner { padding:10px 14px; border:3px solid var(--warn); color:var(--warn); margin-bottom:14px; }
  </style>
</head>
<body>
  <header>
    <h1>Clipper</h1>
    <nav class="nav">
      <a href="/">Projects</a><a href="/dashboard">Dashboard</a><a href="/campaigns">Campaigns</a><a href="/settings">Settings</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div class="row-between">
        <h2>Environment check</h2>
        <button id="recheck" class="secondary">Check again</button>
      </div>
      <div id="system"><p class="muted">Checking...</p></div>
    </section>

    <section class="card">
      <h2>Settings</h2>
      <div id="restart-banner" class="banner hidden">Saved. Restart the app for these changes to take effect:
        press Ctrl+C in the terminal running it, then run <code>python app.py</code> again.</div>
      <div id="fields" class="form-grid"></div>
      <div class="actions">
        <button id="save">Save settings</button>
        <button id="reset" class="secondary">Reset to defaults</button>
      </div>
      <p id="msg" class="msg"></p>
      <p id="file" class="muted"></p>
    </section>
  </main>

  <script src="/static/settings.js"></script>
  <script src="/static/ext_persona.js"></script>
</body>
</html>
