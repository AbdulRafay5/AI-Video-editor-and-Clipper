name: Creator Studio tests

on:
  push:
    branches: [main]
    paths:
      - 'clipper/creator_api.py'
      - 'clipper/creator_narration_api.py'
      - 'clipper/creator_render_api.py'
      - 'clipper/creator_finish_api.py'
      - 'clipper/creator_subtitle_animation.py'
      - 'clipper/creator_alignment_api.py'
      - 'clipper/creator_music_api.py'
      - 'clipper/creator_providers.py'
      - 'clipper/creator_stock_api.py'
      - 'clipper/mpt_compat/**'
      - 'clipper/local_narration.py'
      - 'clipper/neural_narration.py'
      - 'requirements-voice.txt'
      - 'clipper/db.py'
      - 'tests/test_creator_api.py'
      - 'tests/test_creator_narration.py'
      - 'tests/test_creator_render.py'
      - 'tests/test_creator_finish.py'
      - 'tests/test_creator_subtitle_animation.py'
      - 'tests/test_creator_alignment.py'
      - 'tests/test_creator_music.py'
      - 'tests/test_creator_providers.py'
      - 'tests/test_creator_transitions.py'
      - 'tests/test_creator_stock.py'
      - 'tests/test_neural_narration.py'
      - '.github/workflows/creator-tests.yml'
  workflow_dispatch:

jobs:
  creator-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "flask>=3,<4"
      - name: Check Python syntax
        run: python -m compileall -q clipper tests
      - name: Install FFmpeg for actual rendering tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
      - name: Run Creator Studio regression tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
