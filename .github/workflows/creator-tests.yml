name: Creator Studio tests

on:
  push:
    branches: [main]
    paths:
      - 'clipper/creator_api.py'
      - 'clipper/creator_inference.py'
      - 'app.py'
      - 'config.py'
      - 'requirements.txt'
      - 'scripts/smoke_startup.py'
      - 'clipper/creator_auto_api.py'
      - 'clipper/creator_batch_api.py'
      - 'clipper/creator_image_api.py'
      - 'clipper/creator_video_api.py'
      - 'clipper/local_text_to_video.py'
      - 'clipper/local_imagegen.py'
      - 'clipper/creator_narration_api.py'
      - 'clipper/creator_render_api.py'
      - 'clipper/creator_edit_api.py'
      - 'clipper/creator_finish_api.py'
      - 'clipper/creator_subtitle_animation.py'
      - 'clipper/creator_alignment_api.py'
      - 'clipper/creator_music_api.py'
      - 'clipper/creator_neural_music_api.py'
      - 'clipper/local_musicgen.py'
      - 'clipper/creator_providers.py'
      - 'clipper/creator_stock_api.py'
      - 'clipper/mpt_compat/**'
      - 'clipper/local_narration.py'
      - 'clipper/neural_narration.py'
      - 'requirements-voice.txt'
      - 'requirements-music.txt'
      - 'requirements-images.txt'
      - 'requirements-video.txt'
      - 'clipper/db.py'
      - 'tests/test_creator_*.py'
      - 'tests/test_neural_narration.py'
      - 'static/ext_creator.js'
      - 'tests/creator_frontend_polling.test.cjs'
      - '.github/workflows/creator-tests.yml'
  workflow_dispatch:

jobs:
  creator-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "flask>=3,<4" "numpy>=1.26,<3"
      - name: Check Python syntax
        run: python -m compileall -q clipper tests
      - name: Check Creator Studio browser JavaScript syntax
        run: node --check static/ext_creator.js
      - name: Test Creator Studio frontend polling
        run: node tests/creator_frontend_polling.test.cjs
      - name: Install FFmpeg for actual rendering tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
      - name: Run Creator Studio regression tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  windows-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core application requirements
        run: python -m pip install -r requirements.txt
      - name: Check Windows Python module imports
        run: python -m compileall -q clipper tests app.py config.py scripts
      - name: Smoke test full Windows server over localhost
        run: python scripts/smoke_startup.py
      - name: Test Windows Creator coordination and APIs
        run: |
          python -m unittest discover -s tests -p "test_creator_inference.py" -v
          python -m unittest discover -s tests -p "test_creator_api.py" -v
          python -m unittest discover -s tests -p "test_creator_batch.py" -v
          python -m unittest discover -s tests -p "test_creator_narration.py" -v
